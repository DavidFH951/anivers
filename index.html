<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti con mucho amor 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hearts" aria-hidden="true"></div>

    <!-- PORTADA -->
    <div class="intro" id="intro">
        <button class="intro-heart" id="introHeart" aria-label="Abrir la sorpresa">❤</button>
        <p class="intro-title" id="introTitle"></p>
        <p class="intro-hint">Toca el corazón</p>
    </div>

    <audio id="song" loop preload="metadata"></audio>
    <button class="music-btn" id="musicBtn" aria-label="Pausar o poner la música">♫</button>

    <main>
        <!-- 1. CARTA -->
        <section class="scene active" id="carta">
            <div class="inner">
                <h2>Tengo algo para ti</h2>
                <div class="envelope" id="envelope">
                    <div class="env-back"></div>
                    <div class="env-letter"><span id="envTo"></span></div>
                    <div class="env-front"></div>
                    <div class="env-flap"></div>
                    <button class="seal" id="seal" aria-label="Romper el sello y abrir la carta"></button>
                </div>
                <p class="hint">Rompe el sello para abrir la carta</p>
            </div>
        </section>

        <!-- 2. FOTOS -->
        <section class="scene" id="fotos">
            <div class="inner">
                <h2>Nuestros momentos</h2>
                <div class="photos" id="photos" role="button" tabindex="0" aria-label="Ver la siguiente foto">                </div>
                <p class="hint">Toca la foto para ver la siguiente <span id="photoCount"></span></p>
            </div>
        </section>

        <!-- 3. MÚSICA -->
        <section class="scene" id="musica">
            <div class="inner">
                <h2>Nuestra canción</h2>
                <div class="turntable">
                    <div class="vinyl"><div class="vinyl-label"></div></div>
                    <div class="arm"></div>
                </div>
                <p class="song-name" id="songName"></p>
                <div class="player">
                    <button class="play-btn" id="playBtn" aria-label="Reproducir o pausar">▶</button>
                    <input type="range" id="progress" min="0" max="100" value="0" aria-label="Avance de la canción">
                    <span id="time">0:00</span>
                </div>
            </div>
        </section>

        <!-- 4. VIDEOS -->
        <section class="scene" id="videos">
            <div class="inner">
                <h2>Nuestros videos</h2>
                <div class="video-list" id="videoList"></div>
            </div>
        </section>

        <!-- 5. FRASES -->
        <section class="scene" id="frases">
            <div class="inner">
                <h2>Cosas que te quiero decir</h2>
                <div class="cards" id="cards"></div>
                <p class="hint">Toca cada tarjeta para voltearla</p>
            </div>
        </section>
    </main>

    <!-- CARTA ABIERTA -->
    <div class="paper" id="paper" role="dialog" aria-modal="true" aria-label="Carta">
        <article class="sheet">
            <button class="close" id="closeLetter" aria-label="Guardar la carta">✕</button>
            <h3 id="saludo"></h3>
            <div id="parrafos"></div>
            <footer>
                <span>Con todo mi amor,</span>
                <strong id="firma"></strong>
            </footer>
        </article>
    </div>

    <nav class="nav" aria-label="Secciones">
        <button class="active" data-go="0"><span>💌</span>Carta</button>
        <button data-go="1"><span>📷</span>Fotos</button>
        <button data-go="2"><span>🎵</span>Música</button>
        <button data-go="3"><span>🎬</span>Videos</button>
        <button data-go="4"><span>💬</span>Frases</button>
    </nav>

    <!-- Todo el texto, fotos y videos se cambian en contenido.js -->
    <script src="contenido.js"></script>
    <script src="script.js"></script>
</body>
</html>
